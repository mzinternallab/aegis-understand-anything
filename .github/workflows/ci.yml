name: CI

on:
  # Run on every PR so a contributor's first push gets feedback.
  pull_request:
  # Also run on direct pushes to main so the "main is green" signal is real.
  # Without this, main can silently break for days when someone bypasses
  # review. (#249)
  push:
    branches: [main]

# Cancel any in-flight CI for the same ref when a new commit is pushed —
# saves runner minutes and keeps the latest commit's status the only one
# anyone reads. `github.ref` is a controlled value (refs/heads/* or
# refs/pull/*/merge), not user-controlled input, so it's safe to interpolate.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege GITHUB_TOKEN.
# NIST SP 800-53 Rev.5 AC-6 (Least Privilege), CM-7 (Least Functionality).
# GitHub hardening guidance for Actions.
#
# Without an explicit block the token inherits the repository/organisation
# default, which in many orgs is still write-all. This job installs
# dependencies from the registry and executes repository test code, so a
# malicious dependency build script or injected test could read a write-capable
# token straight out of the runner environment and push commits, edit workflows,
# or replace release assets. Read-only is all CI needs.
#
# deploy-homepage.yml already declares its permissions explicitly; this brings
# CI in line.
permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # ACTION PINNING (outstanding — see docs/security/2026-07-25-security-assessment.md, F-08).
    # CISA/NSA "Securing the Software Supply Chain"; NIST SP 800-218 PO.3.2 call
    # for immutable references. The `@vN` tags below are MUTABLE: whoever
    # controls the action repo can repoint a tag at new code that then runs with
    # this workflow's token and secrets.
    #
    # To pin (do not guess a SHA — resolve each one):
    #   gh api repos/actions/checkout/git/ref/tags/v7.0.0 --jq .object.sha
    # then rewrite as:
    #   - uses: actions/checkout@<40-char-sha>  # v7.0.0
    # and enable Dependabot for "github-actions" so the pins stay current.
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Build core
        run: pnpm --filter @understand-anything/core build

      - name: Build skill
        run: pnpm --filter @understand-anything/skill build

      - name: Build viewer
        run: pnpm --filter understand-anything-viewer build

      - name: Test core
        run: pnpm --filter @understand-anything/core test

      - name: Test skill
        run: pnpm test

      - name: Test Python skill helpers
        run: python -m unittest tests.skill.understand.test_merge_batch_graphs tests.skill.understand.test_merge_subdomain_graphs tests.skill.knowledge.test_parse_knowledge_base -v
